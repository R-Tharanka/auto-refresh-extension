<!-- feedback/templates/feedback/feedback_form.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="icon" type="image/x-icon" href="{% static 'icons/support-icon.png' %}">
    {% load static %}
    <link rel="stylesheet" href="{% static 'feedback/styles.css' %}">
    <title>Support</title>
</head>
<body>
    <h1>Submit Your Feedback</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit Feedback</button>
    </form>
</body>
</html>
