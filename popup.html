<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Refresher</title>
    <style>
        /* Add your CSS styles here */
        body {
            font-family: Arial, sans-serif;
            padding: 10px;
        }
        input {
            margin: 5px;
        }
        button {
            margin: 5px;
        }
        #status {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Tab Refresher</h1>
    <div>
        <label for="refreshTime">Refresh Interval (ms):</label>
        <input type="number" id="refreshTime" value="5000" min="1000">
    </div>
    <div>
        <label for="refreshCount">Refresh Count:</label>
        <input type="number" id="refreshCount" value="10" min="1">
    </div>
    <div>
        <button id="startBtn">Start Refresh</button>
        <button id="stopBtn">Stop Refresh</button>
        <button id="pauseBtn">Pause Refresh</button>
        <button id="resumeBtn">Resume Refresh</button>
    </div>
    <div id="status"></div>
    <script src="popup.js"></script>
</body>
</html>
